<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Échange de séries</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#d9dde3;--ac:#0b5cad;--act:#fff;--ok:#1a7f4b;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--tx:#eceff3;--mut:#9aa4b2;--bd:#323943;--ac:#5aa6ee;--act:#0b1118;--ok:#52c789;--err:#f97066}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:8px 0 2px}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 10px}
.sub,.note{color:var(--mut);font-size:.88rem;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
input[type=checkbox]{width:auto;margin-right:8px}
.chk{display:flex;align-items:flex-start;font-size:.85rem;color:var(--mut);margin:12px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg button,.tabs button{font:inherit;padding:14px 4px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
.seg button.on,.tabs button.on{background:var(--ac);border-color:var(--ac);color:var(--act);font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.tabs button{padding:10px 4px;background:var(--card)}
.btn{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:var(--act);cursor:pointer;font-weight:600;margin-top:12px}
.btn.alt{background:transparent;color:var(--ac)}
.btn.danger{background:transparent;color:var(--err);border-color:var(--err)}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--ac);font:inherit;cursor:pointer;padding:8px 0;text-decoration:underline}
.mini{font:inherit;font-size:.85rem;padding:7px 12px;border-radius:9px;border:1px solid var(--ac);background:transparent;color:var(--ac);cursor:pointer}
.offer{border-top:1px solid var(--bd);padding:12px 0}
.offer:first-child{border-top:0}
.t{font-weight:600}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);font-size:.8rem;margin:4px 6px 4px 0}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.int{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);font-size:.88rem}
.msg{min-height:1.3em;font-size:.9rem;margin:8px 0 0}
.msg.ok{color:var(--ok)}.msg.err{color:var(--err)}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Échange de séries</h1>

<section id="vAuth" class="hide">
<p class="sub">Échange de semaines de série entre collègues conducteurs.</p>
<div class="card">
<h2 id="aTitle">Connexion</h2>
<label for="nom">Nom et prénom</label>
<input id="nom" autocomplete="username" placeholder="Jean Dupont">
<label for="pwd">Mot de passe (6 caractères minimum)</label>
<input id="pwd" type="password" autocomplete="current-password">
<label class="chk hide" id="cLab"><input type="checkbox" id="consent"><span>J’accepte que mon nom soit visible des collègues inscrits sur les offres que je publie. Je peux supprimer mon compte à tout moment. Attention : sans e-mail, un mot de passe oublié ne peut être réinitialisé que par l’administrateur.</span></label>
<button class="btn" id="go">Se connecter</button>
<button class="link" id="mode">Pas encore de compte ? Créer mon compte</button>
<p class="msg" id="authMsg"></p>
</div>
</section>

<section id="vApp" class="hide">
<div class="tabs">
<button id="tP" class="on">Proposer</button><button id="tB">Tableau</button><button id="tR">Profil</button>
</div>

<div id="pP">
<div class="card">
<h2>Je donne</h2>
<div class="row">
<div><label for="serie">Série</label><input id="serie" value="L" maxlength="3"></div>
<div><label for="sem">Semaine</label><select id="sem"></select></div>
</div>
<label>Prestation</label>
<div class="seg" id="sG"></div>
</div>
<div class="card">
<h2>Je souhaite en échange</h2>
<label>Type de prestation (un ou plusieurs)</label>
<div class="seg" id="sW"></div>
</div>
<div class="card">
<h2>Période concernée</h2>
<div class="row">
<div><label for="d1">Du</label><input type="date" id="d1"></div>
<div><label for="d2">Au</label><input type="date" id="d2"></div>
</div>
<button class="btn" id="pub">Publier ma demande</button>
<p class="msg" id="pubMsg"></p>
</div>
</div>

<div id="pB" class="hide">
<div class="card">
<h2>Offres disponibles</h2>
<div class="row">
<div><label for="fser">Série</label><input id="fser" placeholder="Toutes" maxlength="3"></div>
<div><label for="ftype">Je cherche</label><select id="ftype"><option value="">Tout type</option><option>Matin</option><option>Soir</option><option>Nuit</option><option>Journée</option></select></div>
</div>
<p class="msg" id="bMsg"></p>
<div id="board"></div>
</div>
</div>

<div id="pR" class="hide">
<div class="card">
<h2>Mon profil</h2>
<label for="prenom">Nom affiché</label><input id="prenom">
<label for="contact">Contact (facultatif : GSM…)</label>
<input id="contact" placeholder="Visible des collègues à qui tu réponds ou qui répondent à toi">
<button class="btn" id="saveP">Enregistrer</button>
<p class="msg" id="pMsg"></p>
<button class="btn alt" id="out">Se déconnecter</button>
<button class="btn danger" id="del">Supprimer mon compte et mes offres</button>
</div>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
var SB_URL="https://iasqudlrolsncplodsqr.supabase.co";
var SB_KEY="sb_publishable_8Oe_ktlLkGpysTHDOLD6FQ_8n9Tl1J1";
var sb=supabase.createClient(SB_URL,SB_KEY);
var TYPES=["Matin","Soir","Nuit","Journée"];
var $=function(i){return document.getElementById(i)};
var st={give:"Matin",want:["Matin"]}, me=null, profil=null, signup=false;

function say(id,t,ok){var e=$(id);e.textContent=t||"";e.className="msg"+(t?(ok?" ok":" err"):"")}
function fd(v){if(!v)return"…";var p=v.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function ident(nom){
  var s=nom.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,".").replace(/^\.+|\.+$/g,"");
  return s?s+"@echange-series.app":"";
}

for(var i=1;i<=15;i++){var o=document.createElement("option");o.value=o.textContent=i;$("sem").appendChild(o)}
function seg(box,multi){
  TYPES.forEach(function(p){
    var b=document.createElement("button");b.type="button";b.textContent=p;
    b.onclick=function(){
      if(multi){var k=st.want.indexOf(p);if(k>=0){if(st.want.length>1)st.want.splice(k,1)}else st.want.push(p)}
      else st.give=p;
      paint();
    };
    box.appendChild(b);
  });
}
seg($("sG"),false);seg($("sW"),true);
function paint(){
  $("sG").querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.textContent===st.give)});
  $("sW").querySelectorAll("button").forEach(function(b){b.classList.toggle("on",st.want.indexOf(b.textContent)>=0)});
}
paint();

function show(v){["vAuth","vApp"].forEach(function(x){$(x).classList.toggle("hide",x!==v)})}
function tab(t){
  [["tP","pP"],["tB","pB"],["tR","pR"]].forEach(function(p){
    $(p[0]).classList.toggle("on",p[0]===t);
    $(p[1]).classList.toggle("hide",p[0]!==t);
  });
  if(t==="tB")loadBoard();
}
["tP","tB","tR"].forEach(function(t){$(t).onclick=function(){tab(t)}});

$("mode").onclick=function(){
  signup=!signup;
  $("aTitle").textContent=signup?"Créer mon compte":"Connexion";
  $("go").textContent=signup?"Créer mon compte":"Se connecter";
  $("mode").textContent=signup?"J’ai déjà un compte : me connecter":"Pas encore de compte ? Créer mon compte";
  $("cLab").classList.toggle("hide",!signup);
  $("pwd").autocomplete=signup?"new-password":"current-password";
  say("authMsg","");
};
$("go").onclick=async function(){
  var nom=$("nom").value.trim(),pwd=$("pwd").value,email=ident(nom);
  if(!email){say("authMsg","Indique ton nom et prénom.");return}
  if(pwd.length<6){say("authMsg","Mot de passe : 6 caractères minimum.");return}
  if(signup&&!$("consent").checked){say("authMsg","Coche la case de consentement.");return}
  $("go").disabled=true;
  var r=signup
    ?await sb.auth.signUp({email:email,password:pwd,options:{data:{nom:nom}}})
    :await sb.auth.signInWithPassword({email:email,password:pwd});
  $("go").disabled=false;
  if(r.error){
    var m=r.error.message||"";
    if(/already|registered/i.test(m))m="Ce nom est déjà inscrit. Connecte-toi, ou ajoute une initiale ou un numéro à ton nom.";
    else if(/invalid login/i.test(m))m="Nom ou mot de passe incorrect.";
    say("authMsg",m);
  }else if(signup&&!r.data.session){
    say("authMsg","Compte créé, mais la confirmation par e-mail est encore activée dans Supabase (voir le guide).");
  }
};

async function start(session){
  if(!session){me=null;show("vAuth");return}
  me=session.user;show("vApp");
  var r=await sb.from("profils").select("*").maybeSingle();
  profil=r.data;
  if(!profil){
    var nom=(me.user_metadata&&me.user_metadata.nom)||"";
    await sb.from("profils").upsert({user_id:me.id,prenom:nom});
    profil={prenom:nom,contact:null};
  }
  $("prenom").value=profil.prenom||"";$("contact").value=profil.contact||"";
  tab("tP");
}
sb.auth.getSession().then(function(r){start(r.data.session)});
sb.auth.onAuthStateChange(function(ev,s){if(ev==="SIGNED_IN"||ev==="SIGNED_OUT")start(s)});

$("saveP").onclick=async function(){
  var p=$("prenom").value.trim();
  if(!p){say("pMsg","Indique ton nom.");return}
  var c=$("contact").value.trim()||null;
  var r=await sb.from("profils").upsert({user_id:me.id,prenom:p,contact:c});
  if(r.error){say("pMsg","Erreur : "+r.error.message);return}
  profil={prenom:p,contact:c};say("pMsg","Profil enregistré.",true);
};
$("out").onclick=function(){sb.auth.signOut()};
$("del").onclick=async function(){
  if(!confirm("Supprimer définitivement ton compte et toutes tes offres ?"))return;
  var r=await sb.rpc("supprimer_mon_compte");
  if(r.error){say("pMsg","Suppression impossible : "+r.error.message);return}
  await sb.auth.signOut();
};

$("pub").onclick=async function(){
  say("pubMsg","");
  var d1=$("d1").value,d2=$("d2").value;
  if(!d1||!d2){say("pubMsg","Indique les deux dates.");return}
  if(d2<d1){say("pubMsg","La date de fin précède la date de début.");return}
  var serie=$("serie").value.trim().toUpperCase()||"L";
  $("pub").disabled=true;
  var r=await sb.from("offres").insert({prenom:profil.prenom,serie:serie,semaine:serie+$("sem").value,type_donne:st.give,types_voulus:st.want,date_debut:d1,date_fin:d2});
  $("pub").disabled=false;
  if(r.error){say("pubMsg","Publication impossible : "+r.error.message);return}
  say("pubMsg","Demande publiée sur le tableau.",true);
};

async function loadBoard(){
  say("bMsg","Chargement…");
  var today=new Date().toISOString().slice(0,10);
  var q=sb.from("offres").select("*").eq("statut","ouverte").gte("date_fin",today).order("date_debut");
  var s=$("fser").value.trim().toUpperCase();if(s)q=q.eq("serie",s);
  var t=$("ftype").value;if(t)q=q.eq("type_donne",t);
  var r=await q, rr=await sb.from("reponses").select("*");
  if(r.error){say("bMsg","Lecture impossible : "+r.error.message);return}
  say("bMsg","");
  var by={};(rr.data||[]).forEach(function(x){(by[x.offre_id]=by[x.offre_id]||[]).push(x)});
  var h=$("board");h.innerHTML="";
  if(!r.data.length){h.innerHTML='<p class="note">Aucune offre pour le moment.</p>';return}
  r.data.forEach(function(o){
    var d=document.createElement("div");d.className="offer";
    var a=document.createElement("div");a.className="t";a.textContent=o.semaine+" ("+o.type_donne+")";
    var c=document.createElement("span");c.className="chip";c.textContent="Cherche : "+o.types_voulus.join(" / ");
    var n=document.createElement("div");n.className="note";n.style.margin="0";
    n.textContent="Du "+fd(o.date_debut)+" au "+fd(o.date_fin)+" · "+o.prenom+(o.user_id===me.id?" (toi)":"");
    var ac=document.createElement("div");ac.className="acts";
    d.appendChild(a);d.appendChild(c);d.appendChild(n);
    var list=by[o.id]||[];
    if(o.user_id===me.id){
      var e=document.createElement("button");e.className="mini";e.textContent="Échangée";
      e.onclick=async function(){await sb.from("offres").update({statut:"echangee"}).eq("id",o.id);loadBoard()};
      var x=document.createElement("button");x.className="mini";x.textContent="Retirer";
      x.onclick=async function(){await sb.from("offres").delete().eq("id",o.id);loadBoard()};
      ac.appendChild(e);ac.appendChild(x);
      var box=document.createElement("div");box.className="int";
      box.textContent=list.length
        ?"Intéressés : "+list.map(function(y){return y.prenom+(y.contact?" ("+y.contact+")":"")}).join(", ")
        :"Personne n’a encore répondu.";
      d.appendChild(box);
    }else{
      var mine=list.filter(function(y){return y.user_id===me.id})[0];
      var b=document.createElement("button");b.className="mini";
      b.textContent=mine?"Retirer mon intérêt":"Ça m’intéresse";
      b.onclick=async function(){
        b.disabled=true;
        var r2=mine
          ?await sb.from("reponses").delete().eq("id",mine.id)
          :await sb.from("reponses").insert({offre_id:o.id,prenom:profil.prenom,contact:profil.contact});
        if(r2.error){say("bMsg","Action impossible : "+r2.error.message);b.disabled=false;return}
        loadBoard();
      };
      ac.appendChild(b);
    }
    d.appendChild(ac);h.appendChild(d);
  });
}
$("fser").addEventListener("input",loadBoard);
$("ftype").addEventListener("input",loadBoard);
})();
</script>
</body>
</html>
